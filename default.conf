server {
    listen 80;
    server_name sudheerkumargandiboyana.com www.sudheerkumargandiboyana.com myhai.org;
    root /usr/share/nginx/html;
    index index.html;
    set $catalog_root /published/current/portfolio;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    if ($http_x_forwarded_proto = http) {
        return 301 https://sudheerkumargandiboyana.com$request_uri;
    }

    location = / { root /published/current/portfolio; try_files /index.html =503; add_header Cache-Control "no-store" always; }
    location = /resume.html { root /published/current/portfolio; try_files /resume.html =503; add_header Cache-Control "no-store" always; }
    location = /projects { return 301 /projects/; }
    location /projects/ { root /published/current/portfolio; try_files $uri $uri/ =404; add_header Cache-Control "no-store" always; }
    location = /ironman.html { return 301 /; }
    location = /api/catalog/revision { alias /published/current/revision.json; default_type application/json; add_header Cache-Control "no-store" always; }

    if ($host = www.sudheerkumargandiboyana.com) {
        return 301 https://sudheerkumargandiboyana.com$request_uri;
    }

    location = /index.html {
        return 301 https://sudheerkumargandiboyana.com/;
    }

    location = /portfolio {
        return 301 https://sudheerkumargandiboyana.com/$is_args$args;
    }

    location = /portfolio/ {
        return 301 https://sudheerkumargandiboyana.com/$is_args$args;
    }

    location = /portfolio/index.html {
        return 301 https://sudheerkumargandiboyana.com/$is_args$args;
    }

    location = /portfolio/ironman.html {
        return 301 https://sudheerkumargandiboyana.com/ironman.html$is_args$args;
    }

    location = /portfolio/resume.html {
        return 301 https://sudheerkumargandiboyana.com/resume.html$is_args$args;
    }

    location = /robots.txt {
        root /published/current/portfolio;
        try_files $uri =404;
        default_type text/plain;
    }

    location = /sitemap.xml {
        root /published/current/portfolio;
        try_files $uri =404;
        default_type application/xml;
    }

    # Root-domain CMS routes.
    location /api/ {
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location /uploads/ {
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
    }

    location = /admin {
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location = /login {
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # CMS routes must be matched before the generic /portfolio/ static block.
    location /portfolio/api/ {
        rewrite ^/portfolio/(.*)$ /$1 break;
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /portfolio/uploads/ {
        rewrite ^/portfolio/(.*)$ /$1 break;
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
    }

    location = /portfolio/admin {
        rewrite ^/portfolio/(.*)$ /$1 break;
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    location = /portfolio/login {
        rewrite ^/portfolio/(.*)$ /$1 break;
        proxy_pass http://portfolio-cms:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    # Cloudflare Tunnel forwards the full "/portfolio/..." path without
    # stripping the prefix, so it must be stripped here before matching files.
    location /portfolio/ {
        rewrite ^/portfolio/(.*)$ https://sudheerkumargandiboyana.com/$1 permanent;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
