services:
  portfolio:
    build: .
    restart: unless-stopped
    depends_on:
      - cms
    networks:
      ingress:
        aliases:
          - portfolio-prod
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 6

  cms:
    build: ./cms
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=production
    volumes:
      - cms-data:/data
    networks:
      ingress:
        aliases:
          - portfolio-cms
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:4000/api/content']
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  cms-data:

networks:
  ingress:
    external: true
    name: hurricane-chat-ingress
