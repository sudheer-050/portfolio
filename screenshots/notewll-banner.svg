<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Notewll &#183; Speak. Write. Keep the conversation.</title><desc id="desc">Private Windows voice typing, personal notes and meeting transcripts. Offline speech after setup.</desc><defs><radialGradient id="glow"><stop stop-color="#405c51" stop-opacity=".5"/><stop offset="1" stop-color="#0e1212" stop-opacity="0"/></radialGradient></defs><rect width="1440" height="760" rx="32" fill="#101414"/><circle cx="1160" cy="280" r="500" fill="url(#glow)"/><g transform="translate(86 72)"><circle cx="42" cy="42" r="42" fill="#000"/><g fill="#fff"><circle cx="23" cy="42" r="4"/><circle cx="36" cy="42" r="4"/><circle cx="49" cy="42" r="4"/><circle cx="62" cy="42" r="4"/></g><text x="108" y="56" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600">Notewll</text></g><text x="86" y="232" fill="#acc8ba" font-family="Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="4">YOUR VOICE. ON YOUR DEVICE.</text><g fill="#f6f5ef" font-family="Segoe UI,Arial,sans-serif" font-size="78" font-weight="600"><text x="80" y="343">Speak. Write.</text><text x="80" y="437">Keep the conversation.</text></g><text x="86" y="509" fill="#b3beb8" font-family="Segoe UI,Arial,sans-serif" font-size="25">Voice typing, personal notes and meeting transcripts for Windows.</text><g font-family="Segoe UI,Arial,sans-serif" font-size="21"><rect x="86" y="574" width="300" height="62" rx="31" fill="#d1e4d9"/><text x="117" y="614" fill="#14251c">Hold to write &#183; F8</text><text x="420" y="613" fill="#d6ddd8">Mic / Computer / Both</text><text x="86" y="704" fill="#8b9f93" font-size="18">ENGLISH &#183; OFFLINE AFTER SETUP &#183; NO CLOUD ACCOUNT</text></g></svg>