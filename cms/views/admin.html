<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Content studio | Portfolio & HAI</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#edf0f6;background:#0c0e13}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #313541;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:1.25rem;margin:0}p{color:#adb6c8;line-height:1.6}header p{margin:5px 0;font-size:.87rem}.actions,nav{display:flex;gap:10px;flex-wrap:wrap}button,a.button{font:inherit;font-size:.9rem;background:#1e2330;color:#eee;border:1px solid #444d60;border-radius:8px;padding:10px 15px;cursor:pointer;text-decoration:none}button.primary{background:#c9b9ff;color:#171020;border-color:#c9b9ff}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c9b9ff;outline-offset:3px}nav{padding:16px 28px;border-bottom:1px solid #313541}nav button[aria-pressed=true]{background:#3d315b}main{max-width:1100px;margin:auto;padding:28px}.panel{border:1px solid #313541;border-radius:12px;background:#121620;padding:24px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;font-size:.86rem;font-weight:600;margin:16px 0 6px}input,select,textarea{width:100%;font:inherit;font-size:.94rem;padding:11px;border:1px solid #465069;border-radius:7px;background:#0d1119;color:#eef0f6}textarea{min-height:110px;line-height:1.5;resize:vertical}textarea.json{font:13px/1.6 ui-monospace,monospace;min-height:230px}input[type=checkbox]{width:auto;margin-right:8px}.hint{font-size:.82rem;color:#aab4c7}.project-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.project-list button{text-align:left;padding:20px}.project-list strong{display:block;margin-bottom:6px}.tag{color:#c4b5ff;font-size:.8rem}h2{font-size:1.2rem}#notice{position:sticky;top:0;z-index:20;padding:14px 28px;background:#182b26;border-bottom:1px solid #488574;white-space:pre-wrap}#notice.error{background:#361c26;border-color:#bd6d82}#notice:empty{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;padding:14px 0}footer{padding:24px 28px;color:#aab4c7}@media(max-width:650px){header,nav,main{padding:18px}.grid{grid-template-columns:1fr}.panel{padding:18px}.actions{width:100%}.actions button{flex:1}}
</style></head><body><header><div><h1>Content studio</h1><p>One catalog for your portfolio, résumé and HAI.</p></div><div class="actions"><button id="draft">Save draft</button><button id="publish" class="primary">Publish both sites</button><button id="logout">Sign out</button></div></header><div id="notice" role="status" aria-live="polite"></div><nav aria-label="Editor sections"><button data-view="projects" aria-pressed="true">Projects</button><button data-view="profile" aria-pressed="false">Profile & résumé</button><button data-view="status" aria-pressed="false">Publishing & history</button><a class="button" href="/" target="_blank" rel="noopener">View portfolio ↗</a><a class="button" href="https://myhai.org/" target="_blank" rel="noopener">View HAI ↗</a></nav><main id="main"></main><footer>Drafts stay private. Publishing generates both websites together. GitHub synchronization is reported separately. Archive projects to preserve their IDs and URLs.</footer><script>
'use strict';
let state,baseRevision,view='projects',selected=null,dirty=false;
const main=document.getElementById('main');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(text,error=false){const el=document.getElementById('notice');el.textContent=text;el.classList.toggle('error',error);}
async function api(url,body){const r=await fetch('/api/'+url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){location.href='/login';throw Error('Please sign in');}const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
const get=(obj,key)=>key.split('.').reduce((v,k)=>v?.[k],obj);
function set(obj,key,value){const parts=key.split('.');const last=parts.pop();let target=obj;for(const k of parts)target=target[k]??={};target[last]=value;}
function field(key,label,type='text',hint=''){
 const obj=selected!==null?state.projects[selected]:state,value=get(obj,key);
 if(type==='checkbox')return `<label><input type="checkbox" data-key="${key}" ${value?'checked':''}>${e(label)}</label>`;
 return `<div><label for="field-${key}">${e(label)}</label>${type==='textarea'||type==='json'?`<textarea id="field-${key}" data-key="${key}" data-kind="${type}" class="${type==='json'?'json':''}" spellcheck="${type!=='json'}">${e(type==='json'?JSON.stringify(value??[],null,2):value)}</textarea>`:`<input id="field-${key}" data-key="${key}" data-kind="${type}" type="${type==='url'?'url':type==='number'?'number':'text'}" value="${e(type==='lines'?(value||[]).join(', '):value)}">`}${hint?`<p class="hint">${e(hint)}</p>`:''}</div>`;
}
function collect(){const obj=selected!==null?state.projects[selected]:state;for(const input of main.querySelectorAll('[data-key]')){let value=input.type==='checkbox'?input.checked:input.value;if(input.dataset.kind==='json'){try{value=JSON.parse(value);}catch{throw Error('Invalid structured data in '+input.previousElementSibling.textContent);}}if(input.dataset.kind==='number')value=Number(value);if(input.dataset.kind==='lines')value=value.split(',').map(x=>x.trim()).filter(Boolean);set(obj,input.dataset.key,value);}}
function renderProjects(){
 if(selected===null){main.innerHTML=`<div class="panel"><h2>Project catalog</h2><p>Every published record appears in both complete directories. Featured projects appear on your portfolio homepage.</p><button id="add">Add project</button></div><div class="project-list">${state.projects.map((p,i)=>`<button data-edit="${i}"><strong>${e(p.name)}</strong><span class="tag">${e(p.publication)}${p.featured?' · featured':''}</span><p>${e(p.category)}</p></button>`).join('')}</div>`;return;}
 const p=state.projects[selected];
 main.innerHTML=`<button id="back">← All projects</button><div class="panel"><h2>${e(p.name||'New project')}</h2><p class="hint">Permanent ID: ${e(p.id)} · Guide: /projects/${e(p.slug)}/</p><div class="grid">${field('name','Project name')}${field('badge','Short status label')}${field('category','Category')}<div><label for="publication">Publication</label><select id="publication" data-key="publication">${['draft','published','archived'].map(v=>`<option ${v===p.publication?'selected':''}>${v}</option>`).join('')}</select></div>${field('featured','Feature on portfolio homepage','checkbox')}${field('featuredOrder','Homepage order (0 first)','number')}${field('resume','Include in résumé','checkbox')}</div>${field('summary','Shared summary','textarea','Used on both sites, directories and the résumé. Keep it concise.')}<div class="grid">${field('image','Preview image URL','url')}${field('tryUrl','Live app or package URL','url')}<div><label for="source">Source availability</label><select id="source" data-key="sourceAvailability">${['public','private','unavailable'].map(v=>`<option ${v===p.sourceAvailability?'selected':''}>${v}</option>`).join('')}</select></div>${field('sourceUrl','Public repository URL','url','Leave empty for private or unavailable source.')}${field('tryLabel','App button label')}${field('tech','Technology stack','lines','Separate items with commas.')}</div><label for="upload">Upload a preview image</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><p class="hint">PNG, JPEG, WebP or GIF, up to 8 MB.</p></div><div class="panel"><h2>Detailed guide</h2>${field('description','Project description','textarea')}${field('why','Purpose','textarea')}${field('architecture','Architecture','textarea')}${field('trust','Privacy and limitations','textarea')}${field('status','Detailed status','textarea')}<details><summary>Features, workflow, setup and FAQs</summary>${field('workflow','Workflow steps','json','A list of strings.')}${field('features','Features','json','Pairs of feature name and explanation.')}${field('facts','Quick facts','json','Pairs of label and value.')}${field('guide','Setup, use cases, FAQs and gallery','json','Keys: start (text), requirements (list), uses and faq (pairs), gallery (optional image URL/caption pairs).')}</details></div><div class="panel"><h2>Evidence & releases</h2><p>Attach claims to a source, version, review date and measurement scope. Refresh from GitHub to save releases in the draft, then publish when reviewed.</p><button id="refresh">Refresh releases from GitHub</button><details><summary>Edit evidence and release metadata</summary>${field('evidence','Evidence records','json')}${field('releases','Release metadata','json','Stable releases and previews are displayed separately. Only the newest five stable versions appear.')}</details></div>`;
}
function renderProfile(){main.innerHTML=`<div class="panel"><h2>Profile & contact</h2><div class="grid">${field('profile.name','Full name')}${field('profile.headline','Professional headline')}${field('profile.graduation','Graduation')}${field('contact.location','Location')}${field('contact.email','Email')}${field('contact.phone','Phone')}${field('contact.linkedin','LinkedIn','url')}${field('contact.github','GitHub','url')}${field('profileImage','Portrait URL','url')}</div>${field('profile.summary','Résumé and GitHub summary','textarea')}${field('hero.badge','Homepage availability label')}${field('hero.sub','Homepage introduction','textarea')}${field('about.intro','About headline','textarea')}${field('about.paragraphs','About paragraphs','json')}</div><div class="panel"><h2>Résumé details</h2><p>These records generate the portfolio and printable résumé. Entries use title, date, organization and bullets.</p>${field('profile.education','Education','json')}${field('profile.experience','Experience','json')}${field('profile.skills','Skills','json')}${field('certifications','Certifications','json')}</div>`;}
async function renderStatus(){main.innerHTML='<p>Loading publication status…</p>';const [status,history]=await Promise.all([api('publishing-status'),api('history')]);if(view!=='status')return;main.innerHTML=`<div class="panel"><h2>Published revision</h2><p><strong>${e(status.revision)}</strong></p><p>Portfolio: snapshot generated<br>HAI: snapshot generated</p><h2>GitHub synchronization</h2><p>${e(status.github.state)} · ${e(status.github.message||'')}<br>Revision: ${e(status.github.revision||'not synced')}<br>${e(status.github.checkedAt||'')}</p><p class="hint">Both website snapshots share one publication pointer. Verify the public pages after publishing. GitHub retries on the server schedule; failed synchronization does not undo the websites.</p><button id="reload-status">Refresh status</button></div><div class="panel"><h2>Revision history</h2><p>Restore republishes a previous complete catalog to both sites. Save any draft work first.</p>${history.map(r=>`<p><code>${e(r.revision)}</code> · ${e(r.publishedAt)} ${r.revision!==status.revision?`<button data-restore="${r.revision}">Restore this revision</button>`:' · current'}</p>`).join('')}</div>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(view==='projects')renderProjects();else if(view==='profile')renderProfile();else renderStatus().catch(err=>notice(err.message,true));}
main.addEventListener('input',()=>{dirty=true;});
main.addEventListener('click',async event=>{const b=event.target.closest('button');if(!b)return;try{
 if(b.dataset.edit!==undefined){collect();selected=Number(b.dataset.edit);render();window.scrollTo(0,0);}
 if(b.id==='back'){collect();selected=null;render();}
 if(b.id==='add'){const id=prompt('Permanent project ID (lowercase letters, numbers and hyphens):');if(!id)return;if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)||state.projects.some(p=>p.id===id||p.slug===id))throw Error('Choose a unique lowercase ID.');state.projects.push({id,slug:id,name:'New project',category:'Project',badge:'Draft',summary:'Describe the project.',description:'',image:'',featured:false,featuredOrder:999,resume:false,publication:'draft',aliases:[],tech:[],why:'',features:[],workflow:[],architecture:'',trust:'',status:'Draft',facts:[],sourceAvailability:'unavailable',sourceUrl:'',tryUrl:'',tryLabel:'',guide:{uses:[],requirements:[],start:'',faq:[]},evidence:[],releases:[]});selected=state.projects.length-1;dirty=true;render();}
 if(b.id==='refresh'){collect();await api('draft',{content:state,expectedRevision:baseRevision});b.disabled=true;const data=await api('releases/'+state.projects[selected].id+'/refresh',{expectedRevision:baseRevision});state=data.content;dirty=false;render();notice('Release metadata saved to draft. Review and publish to update the websites.');}
 if(b.id==='reload-status')await renderStatus();
 if(b.dataset.restore){if(dirty&&!confirm('Restore will replace unsaved changes. Continue?'))return;await api('restore',{revision:b.dataset.restore,expectedRevision:baseRevision});await load();notice('Previous catalog restored on both website snapshots.');}
 }catch(err){notice(err.message,true);}finally{b.disabled=false;}});
main.addEventListener('change',async event=>{if(event.target.id!=='upload'||!event.target.files[0])return;try{collect();const body=new FormData();body.append('image',event.target.files[0]);const r=await fetch('/api/upload',{method:'POST',body});const data=await r.json();if(!r.ok)throw Error(data.error||'Upload failed');state.projects[selected].image=data.path;dirty=true;render();notice('Image uploaded. Publish to use it on both sites.');}catch(err){notice(err.message,true);}});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{try{collect();selected=null;view=b.dataset.view;render();}catch(err){notice(err.message,true);}}));
for(const action of ['draft','publish'])document.getElementById(action).addEventListener('click',async()=>{const b=document.getElementById(action);b.disabled=true;try{collect();const result=await api(action==='draft'?'draft':'content',{content:state,expectedRevision:baseRevision});if(action==='publish')baseRevision=result.revision;dirty=false;notice(action==='draft'?'Draft saved. Public websites are unchanged.':'Published both website snapshots at revision '+baseRevision+'. GitHub status is reported separately.');if(view==='status')render();}catch(err){notice(err.message,true);}finally{b.disabled=false;}});
document.getElementById('logout').addEventListener('click',async()=>{if(dirty&&!confirm('Leave with unsaved changes?'))return;await api('logout',{});location.href='/login';});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
async function load(){const data=await api('draft');state=data.content;baseRevision=data.baseRevision;selected=null;dirty=false;render();}
load().catch(err=>notice(err.message,true));
</script></body></html>
