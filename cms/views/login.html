<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#0f1115; color:#e6e8eb; min-height:100vh;
    display:flex; align-items:center; justify-content:center; margin:0;
  }
  .box{ background:#171a21; border:1px solid #2a2e37; border-radius:10px; padding:36px 32px; width:320px; }
  h1{ font-size:1.1em; margin:0 0 18px; }
  input{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid #2a2e37;
    background:#0f1115; color:#e6e8eb; font-size:0.95em; margin-bottom:12px;
  }
  button{
    width:100%; padding:10px 12px; border-radius:6px; border:none;
    background:#2563eb; color:#fff; font-weight:600; cursor:pointer; font-size:0.95em;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:#f87171; font-size:0.85em; margin:-4px 0 12px; min-height:1em; }
</style>
</head>
<body>
  <form class="box" id="loginForm">
    <h1>Admin Login</h1>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button type="submit" id="submitBtn">Log in</button>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const res = await fetch('api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = 'admin';
        } else {
          errorEl.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        errorEl.textContent = 'Network error';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
