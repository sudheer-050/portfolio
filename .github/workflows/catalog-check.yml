name: Catalog regression checks
on:
  push:
    paths: ['cms/**', '.github/workflows/catalog-check.yml']
  pull_request:
    paths: ['cms/**', '.github/workflows/catalog-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm test
